<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Rook Search is a private new tab page. No account, no tracking.">
<title>Rook Search</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div>
<div id="shade"></div>

<main id="home" hidden>
  <div id="mark" aria-hidden="true"></div>
  <div id="clock"></div>
  <div id="greeting"></div>
  <div id="weather" hidden></div>

  <form id="search" autocomplete="off" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="text" autofocus>
  </form>

  <div id="favs"></div>
  <div id="recent" hidden></div>
</main>

<button id="gear" class="round" hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<!-- Intro before the onboarding: the raven is revealed, then a short text. A click skips the animation. -->
<section id="intro" hidden>
  <div class="intro-mark" aria-hidden="true"><div class="intro-reveal"><div class="intro-raven"></div></div></div>
  <h1 class="intro-name">Rook Search</h1>
  <p class="intro-text" id="introText"></p>
  <button type="button" class="btn light intro-go" id="introGo" data-i18n="introGo"></button>
</section>

<!-- Onboarding -->
<section id="onboarding" class="backdrop" hidden>
  <div class="sheet wide">
    <div class="steps" id="obDots"></div>
    <div id="obBody"></div>
    <div class="row">
      <button type="button" class="btn ghost" id="obSkip"></button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="obBack"></button>
      <button type="button" class="btn primary" id="obNext"></button>
    </div>
  </div>
</section>

<!-- Favorite editor -->
<section id="favDialog" class="backdrop" hidden>
  <form class="sheet" id="favForm">
    <h2 id="favTitle"></h2>
    <label for="favName" data-i18n="name"></label>
    <input id="favName" type="text" required maxlength="40">
    <label for="favUrl" data-i18n="address"></label>
    <input id="favUrl" type="text" required placeholder="example.com">
    <div class="row">
      <button type="button" class="btn danger" id="favDelete" data-i18n="delete"></button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="favCancel" data-i18n="cancel"></button>
      <button type="submit" class="btn primary" data-i18n="save"></button>
    </div>
  </form>
</section>

<!-- Settings (the gear): four tabs. Parts marked app-only exist only inside the Rook Search browser. -->
<section id="setDialog" class="backdrop" hidden>
  <div class="sheet settings">
    <div class="set-head">
      <h2 data-i18n="settings"></h2>
      <div class="seg" id="sTabs" role="tablist">
        <button type="button" role="tab" data-pane="look" data-i18n="tabLook"></button>
        <button type="button" role="tab" data-pane="start" data-i18n="tabStart"></button>
        <button type="button" role="tab" data-pane="browser" data-i18n="tabBrowser"></button>
        <button type="button" role="tab" data-pane="privacy" data-i18n="tabPrivacy"></button>
      </div>
    </div>

    <div class="pane" data-pane="look">
      <h3 data-i18n="background"></h3>
      <div class="bgs" id="sBgs"></div>
      <label for="sDim" data-i18n="dim"></label>
      <input id="sDim" type="range" min="0" max="80" step="5">
      <h3 data-i18n="accent"></h3>
      <div class="swatches" id="sAccent"></div>
      <h3 data-i18n="language"></h3>
      <select id="sLang"><option value="auto"></option><option value="en">English</option><option value="de">Deutsch</option></select>
    </div>

    <div class="pane" data-pane="start">
      <h3 data-i18n="greetingTitle"></h3>
      <label for="sName" data-i18n="yourName"></label>
      <input id="sName" type="text" maxlength="30">
      <label class="check"><input type="checkbox" id="sClock"> <span data-i18n="showClock"></span></label>
      <label class="check"><input type="checkbox" id="sLogo"> <span data-i18n="showLogo"></span></label>
      <h3 data-i18n="startContent"></h3>
      <label class="check"><input type="checkbox" id="sShowFavs"> <span data-i18n="showFavs"></span></label>
      <label class="check app-only"><input type="checkbox" id="sShowRecent"> <span data-i18n="showRecent"></span></label>
      <label class="check"><input type="checkbox" id="sIcons"> <span data-i18n="loadIcons"></span></label>
      <p class="hint" data-i18n="loadIconsHint"></p>
      <h3 data-i18n="weather"></h3>
      <label class="check"><input type="checkbox" id="sWeather"> <span data-i18n="showWeather"></span></label>
      <label for="sCity" data-i18n="weatherCity"></label>
      <input id="sCity" type="text" maxlength="60" placeholder="Berlin">
      <p class="hint" data-i18n="weatherHint"></p>
      <div class="row tight"><button type="button" class="btn" id="sRestart" data-i18n="restartOnboarding"></button></div>
    </div>

    <div class="pane" data-pane="browser">
      <h3 data-i18n="search"></h3>
      <label for="sEngine" data-i18n="engine"></label>
      <select id="sEngine"></select>
      <div class="app-only">
        <h3 data-i18n="downloads"></h3>
        <div class="kv"><span class="kv-label" data-i18n="downloadFolder"></span><code id="sFolder">–</code></div>
        <div class="row tight">
          <button type="button" class="btn" id="sFolderChange" data-i18n="change"></button>
          <button type="button" class="btn" id="sFolderShow" data-i18n="showInFinder"></button>
          <button type="button" class="btn ghost" id="sFolderReset" data-i18n="standardFolder"></button>
        </div>
        <label class="check"><input type="checkbox" id="sAsk"> <span data-i18n="askWhereToSave"></span></label>
        <p class="hint" data-i18n="downloadsHint"></p>
        <h3 data-i18n="tabsTitle"></h3>
        <label class="check"><input type="checkbox" id="sRestore"> <span data-i18n="restoreSession"></span></label>
        <h3 data-i18n="defaultBrowser"></h3>
        <p class="hint" id="sDefaultStatus"></p>
        <div class="row tight">
          <button type="button" class="btn" id="sMakeDefault" data-i18n="makeDefault"></button>
          <button type="button" class="btn" id="sImportBookmarks" data-i18n="importBookmarks"></button>
        </div>
      </div>
      <p class="hint web-only" data-i18n="appOnlyHint"></p>
    </div>

    <div class="pane" data-pane="privacy">
      <div class="app-only">
        <h3 data-i18n="blocker"></h3>
        <div class="group" id="sBlockerGroup">
          <label class="item"><span class="item-text" data-i18n="blockerToggle"></span><input type="checkbox" class="switch" id="sBlocker"></label>
          <div class="item" id="sBlockerStatusRow">
            <span class="item-text"><span data-i18n="filterLists"></span><small id="sBlockerStatus"></small></span>
            <button type="button" class="link" id="sBlockerUpdate" data-i18n="update"></button>
          </div>
        </div>
        <h3 data-i18n="exceptions"></h3>
        <div class="group" id="sExceptions"></div>
        <h3 data-i18n="historyTitle"></h3>
        <div class="group">
          <div class="item">
            <span class="item-text"><span data-i18n="history"></span><small id="sHistoryInfo"></small></span>
            <button type="button" class="link danger" id="sClearHistory" data-i18n="delete"></button>
          </div>
          <div class="item">
            <span class="item-text"><span data-i18n="cookies"></span><small data-i18n="cookiesHint"></small></span>
            <button type="button" class="link danger" id="sClearData" data-i18n="delete"></button>
          </div>
        </div>
        <h3 data-i18n="sitePermissions"></h3>
        <div class="group" id="sSites"></div>
      </div>
      <h3 data-i18n="backup"></h3>
      <div class="group">
        <div class="item"><span class="item-text" data-i18n="exportSettings"></span><button type="button" class="link" id="sExport" data-i18n="export"></button></div>
        <div class="item"><span class="item-text" data-i18n="importSettings"></span><button type="button" class="link" id="sImport" data-i18n="import"></button></div>
        <div class="item"><span class="item-text" data-i18n="resetAll"></span><button type="button" class="link danger" id="sReset" data-i18n="reset"></button></div>
      </div>
      <input id="sImportFile" type="file" accept="application/json,.json" hidden>
      <p class="hint" data-i18n="editHint"></p>
    </div>

    <div class="row end"><button type="button" class="btn primary" id="sClose" data-i18n="done"></button></div>
  </div>
</section>

<input id="bgFile" type="file" accept="image/*" hidden>

<script src="app.js"></script>
</body>
</html>
